<!doctype html>
<html lang="es-DO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E3F1F4" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <!-- The name, tagline and description here are filled in from src/brand.ts at build time (vite.config.ts). -->
    <!-- Link previews. A pet's page (/mascota/<id>) gets its own from the Worker (api/src/share.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:title" content="%APP_NAME% · %APP_TAGLINE%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google's results show a favicon in a multiple of 48 px, and not every crawler reads SVG. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Installing to the home screen (no service worker: the app is live data, and a cached shell could outlive a deploy). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <title>%APP_NAME% · %APP_TAGLINE%</title>
  </head>
  <body>
    <!-- What a crawler (or a browser with scripts off) reads of the page before it draws itself; the script replaces it. -->
    <noscript>
      <h1>%APP_NAME% · %APP_TAGLINE%</h1>
      <p>%APP_DESCRIPTION% Para ver a los animales necesitas activar JavaScript.</p>
      <p><a href="/privacidad">Política de privacidad</a> · <a href="/terminos">Términos de uso</a> · <a href="/en/privacy">Privacy Policy</a> · <a href="/en/terms">Terms of Use</a></p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
