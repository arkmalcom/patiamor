# main = staging. Every push to main migrates, re-seeds and deploys the staging Worker.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never interrupt a deploy halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment secrets: CLOUDFLARE_API_TOKEN (staging token), STAGING_ADMIN_EMAILS. Restricted to main.
    environment:
      name: staging
      url: https://patiamor-staging.patiamor-api.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://patiamor-staging.patiamor-api.workers.dev
      STAGING_ADMIN_EMAILS: ${{ secrets.STAGING_ADMIN_EMAILS }} # comma-separated; kept out of the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix api

      - name: Build web
        run: npm run build --prefix web
        env:
          # Staging runs on sample data: show the "Demo" tag and the "Datos de ejemplo" note (web/src/data.ts).
          VITE_DEMO: '1'

      - name: Type-check API
        run: npm run typecheck --prefix api

      - name: Apply migrations (staging)
        working-directory: api
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Seed sample data (staging only, idempotent)
        working-directory: api
        run: npx wrangler d1 execute DB --env staging --remote --file seeds/staging.sql

      - name: Promote staging admins
        if: env.STAGING_ADMIN_EMAILS != ''
        working-directory: api
        run: |
          for email in $(echo "$STAGING_ADMIN_EMAILS" | tr ',' ' '); do
            # Strict pattern doubles as SQL-injection protection for the inline value below.
            if ! printf '%s' "$email" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
              echo "::error::Invalid email in STAGING_ADMIN_EMAILS"; exit 1
            fi
            npx wrangler d1 execute DB --env staging --remote --command \
              "INSERT INTO users (id, email, is_admin) VALUES (lower(hex(randomblob(16))), '$email', 1) ON CONFLICT(email) DO UPDATE SET is_admin = 1"
          done

      - name: Deploy Worker (staging)
        working-directory: api
        run: npx wrangler deploy --env staging

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$STAGING_URL/api/health" | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "::error::Staging health check failed"; exit 1
