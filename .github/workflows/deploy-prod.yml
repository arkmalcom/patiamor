# prod = production. Runs only when the prod branch moves (i.e. a PR from main is merged into prod).
# The merge is the approval: nobody, human or agent, should push to prod directly.
name: Deploy production

on:
  push:
    branches: [prod]
  workflow_dispatch: # manual re-run; the job refuses any ref other than prod

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    # Environment secret: CLOUDFLARE_API_TOKEN (production token). Restricted to prod, with the owner as
    # required reviewer, so every production deploy waits for an explicit approval in GitHub.
    environment:
      name: production
      url: https://patiamor.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://patiamor.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix api

      - name: Build web
        run: npm run build --prefix web

      - name: Type-check API
        run: npm run typecheck --prefix api

      - name: Record restore point (D1 Time Travel)
        # Undo path for a bad migration: `wrangler d1 time-travel restore DB --bookmark <this>` (owner approval).
        working-directory: api
        run: npx wrangler d1 time-travel info DB

      - name: Apply migrations (production)
        working-directory: api
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker (production)
        working-directory: api
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$PROD_URL/api/health" | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "::error::Production health check failed. Roll back with: wrangler rollback (see the Cloudflare skill)"; exit 1
